name: Build Release AAB

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > kipi-release-keystore.jks

      - name: Gradle permission
        run: chmod +x ./gradlew

      - name: Extract version from tag
        run: echo "VERSION_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Generate versionCode based on date
        run: |
          VERSION_CODE=$(date +%Y%m%d)
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Update versionCode and versionName in build.gradle.kts
        run: |
          sed -i "s/versionCode = [0-9]\+/versionCode = $VERSION_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}

      - name: Build Release AAB
        run: ./gradlew bundleRelease --no-daemon
        env:
          RELEASE_STORE_FILE: kipi-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kipi-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
